<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Momento</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- Single App Shell -->
    <div class="card">

        <!-- Top Bar -->
        <div class="top-bar">
            <div class="top-bar-left">
                <span class="app-title">Momento</span>
                <span id="live-date" class="top-bar-date"></span>
            </div>
            <div class="top-bar-right">
                <span id="live-clock" class="top-bar-clock"></span>
            </div>
        </div>

        <!-- Now / Next chips -->
        <div id="next-task-badge"></div>

        <div class="divider"></div>

        <!-- Day Tabs -->
        <div class="day-tabs" id="day-tabs-container"></div>

        <!-- Day Nav -->
        <div class="nav-header">
            <button class="nav-btn" onclick="changeDay(-1)">&#9664; Prev</button>
            <span id="current-day-label" class="day-label">Monday</span>
            <button class="nav-btn" onclick="changeDay(1)">Next &#9654;</button>
            <button type="button" onclick="copyCurrentDayTo()" class="nav-btn">&#128203; Copy To...</button>
        </div>

        <!-- Routine / Date info -->
        <div class="schedule-info-banner">
            <span id="applied-routine-label">Routine: Custom</span>
            <span id="applied-date-label">Date: --</span>
        </div>

        <!-- Check-in prompt (inline) -->
        <p id="today-prompt" class="checkin-prompt"></p>

        <div class="divider"></div>

        <!-- Tasks -->
        <div id="task-container"></div>
        <button onclick="addTaskRow()" class="add-block-btn">+ Add Time Block</button>

        <!-- Daily Notes -->
        <div class="notes-section">
            <label for="daily-notes"><strong>Notes / Focus:</strong></label>
            <textarea id="daily-notes" placeholder="e.g. Bring gym clothes, focus on chapter 4..."></textarea>
        </div>

        <!-- Save -->
        <button class="save-master-btn" onclick="saveSchedule()">Save &amp; Sort</button>
        <div id="save-status" class="save-status">&#10003; Saved!</div>

    </div>

    <!-- COLLAPSIBLE SIDEBAR DRAWER -->
    <div id="preset-sidebar" class="preset-sidebar">
        <button type="button" id="sidebar-toggle-btn" class="sidebar-toggle-btn" onclick="toggleSidebar()" title="Toggle Presets">
            <span id="sidebar-arrow">&#9664;</span> Tools
        </button>

        <div class="sidebar-content">
            <!-- PRESET MANAGEMENT SECTION -->
            <div class="preset-manager">
                <h3>&#9881;&#65039; Preset Manager</h3>

                <div class="preset-box">
                    <label>Save Active Schedule As Preset:</label>
                    <div class="input-group">
                        <input type="text" id="save-preset-input" placeholder="e.g. Exam Week Plan">
                        <button onclick="saveCurrentAsPreset()" class="preset-btn btn-save">&#128190; Save</button>
                    </div>
                </div>

                <button onclick="openScratchBuilder()" class="preset-btn btn-create-scratch">&#10024; Create Preset From Scratch</button>

                <hr class="sidebar-divider">

                <h4>Your Presets</h4>
                <div id="presets-manager-list" class="presets-list"></div>
            </div>

            <h3>&#9881;&#65039; Control Panel</h3>

            <!-- Theme Accent Picker -->
            <div class="sidebar-group">
                <label>&#127912; Accent Theme</label>
                <div class="theme-swatches">
                    <button type="button" class="swatch" style="background: #6c5ce7;" onclick="setAccentColor('#6c5ce7', '#5b4cc4', 'rgba(108, 92, 231, 0.25)')" title="Purple"></button>
                    <button type="button" class="swatch" style="background: #00cec9;" onclick="setAccentColor('#00cec9', '#00b894', 'rgba(0, 206, 201, 0.25)')" title="Cyan"></button>
                    <button type="button" class="swatch" style="background: #ff7675;" onclick="setAccentColor('#ff7675', '#d63031', 'rgba(255, 118, 117, 0.25)')" title="Coral"></button>
                    <button type="button" class="swatch" style="background: #fdcb6e;" onclick="setAccentColor('#fdcb6e', '#e17055', 'rgba(253, 203, 110, 0.25)')" title="Amber"></button>
                    <button type="button" class="swatch" style="background: #00b894;" onclick="setAccentColor('#00b894', '#009432', 'rgba(0, 184, 148, 0.25)')" title="Green"></button>
                </div>
            </div>

            <!-- Audio -->
            <div class="sidebar-group">
                <label>&#128276; Transition Alerts</label>
                <button type="button" id="notif-toggle-btn" class="btn-info" onclick="toggleNotifications()">Enable Audio Alerts</button>
            </div>

            <!-- Weekly Analytics -->
            <div class="sidebar-group">
                <label>&#128202; Weekly Category Breakdown</label>
                <div id="weekly-analytics-container"></div>
            </div>

            <!-- Master Preset -->
            <div class="sidebar-group">
                <label>Master Preset (Full Week)</label>
                <select id="preset-select"></select>
                <button type="button" class="btn-primary" onclick="applyPreset()">Apply Preset</button>
            </div>

            <!-- Single Day Preset -->
            <div class="sidebar-group">
                <label>Single Day Template</label>
                <select id="single-day-preset-select"></select>
                <button type="button" class="btn-warning" onclick="applySingleDayPreset()">
                    Apply to <span id="override-day-name">Today</span>
                </button>
            </div>

            <!-- Create Preset -->
            <div class="sidebar-group">
                <label>Save Week as New Preset</label>
                <input type="text" id="new-preset-name" placeholder="Preset Name...">
                <button type="button" class="btn-info" onclick="createNewPreset()">&#128190; Save Current as Preset</button>
            </div>

            <!-- Delete Preset -->
            <div class="sidebar-group">
                <label>Delete Custom Preset</label>
                <select id="delete-preset-select"></select>
                <button type="button" class="btn-danger" onclick="deleteSelectedPreset()">&#128465;&#65039; Delete Preset</button>
            </div>
        </div>
    </div>

    <!-- FLOATING AI CHATBOT -->
    <div id="ai-chat-widget">
        <button id="ai-chat-toggle" onclick="toggleChatWindow()">&#129302;</button>

        <div id="ai-chat-window" class="chat-hidden">
            <div class="chat-header">
                <span>&#10024; Momento AI</span>
                <button onclick="toggleChatWindow()">&#10005;</button>
            </div>
            <div id="chat-messages">
                <div class="chat-msg bot-msg">Hey! I can build your schedule, apply presets, or change settings. Type "help" for all commands.</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="e.g. generate study week..." onkeydown="if(event.key === 'Enter') sendChatMessage()">
                <button onclick="sendChatMessage()">Send</button>
            </div>
        </div>
    </div>

    <!-- PRESET BUILDER MODAL -->
    <div id="scratch-preset-modal" class="modal-overlay hidden">
        <div class="modal-box builder-box">
            <div class="modal-header">
                <h3>&#128295; Create Preset From Scratch</h3>
                <button onclick="closeScratchBuilder()" class="close-btn">&#10005;</button>
            </div>

            <div class="modal-body">
                <input type="text" id="scratch-preset-title" placeholder="Preset Name (e.g. Summer Workout Routine)" class="builder-title-input">

                <div id="builder-day-tabs" class="builder-tabs"></div>

                <div class="builder-input-row">
                    <input type="time" id="scratch-start" value="09:00">
                    <input type="time" id="scratch-end" value="10:00">
                    <input type="text" id="scratch-task-name" placeholder="Task description...">
                    <button onclick="addSlotToScratchBuilder()" class="btn-add-slot">+ Add</button>
                </div>

                <div id="builder-tasks-container" class="builder-tasks-list"></div>
            </div>

            <div class="modal-footer">
                <button onclick="closeScratchBuilder()" class="btn-cancel">Cancel</button>
                <button onclick="saveScratchPreset()" class="btn-save-final">&#128190; Save Preset</button>
            </div>
        </div>
    </div>

    <script src="./script.js"></script>
    <script src="./ai-chatbot.js"></script>
</body>

</html>
