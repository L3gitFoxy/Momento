name: Release Momento

on:
  push:
    tags:
      - "v*"

concurrency:
  group: momento-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Configure npm registry
        shell: bash
        run: |
          npm config set registry https://registry.npmjs.org/
          npm config delete proxy || true
          npm config delete https-proxy || true
          npm config get registry

      - name: Install dependencies
        shell: bash
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: |
          npm ci --registry=https://registry.npmjs.org/ || npm install --registry=https://registry.npmjs.org/

      - name: Version from tag
        id: ver
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.argv[1];fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');" "$VER"

      - name: Prepare release notes
        shell: bash
        run: node scripts/prepare-release-notes.js "${{ steps.ver.outputs.version }}"

      - name: Delete any existing release for this tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "${{ github.repository }}" --yes
            sleep 2
          fi

      - name: Build Windows installer (do not publish)
        run: npx electron-builder --win --publish never

      - name: Verify artifacts
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.version }}"
          ls -la dist/
          test -f "dist/Momento-Setup-${VER}.exe" || { echo "MISSING Setup exe"; exit 1; }
          test -f "dist/latest.yml" || { echo "MISSING latest.yml"; exit 1; }

      - name: Create ONE release titled Momento v*
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${{ steps.ver.outputs.version }}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Momento v${VER}" \
            --notes-file "release-notes-current.md" \
            "dist/Momento-Setup-${VER}.exe" \
            "dist/Momento-Setup-${VER}.exe.blockmap" \
            "dist/latest.yml"
