name: Release Momento

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Version from tag
        id: ver
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Tag $TAG -> version $VER"
          # Keep package.json version in sync with tag for this build
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.argv[1];fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');" "$VER"

      - name: Prepare release notes from CHANGELOG.md
        shell: bash
        run: node scripts/prepare-release-notes.js "${{ steps.ver.outputs.version }}"

      - name: Show release notes
        shell: bash
        run: cat release-notes-current.md

      - name: Build & publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always
